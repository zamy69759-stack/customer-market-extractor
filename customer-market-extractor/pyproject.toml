[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-market-extractor"
version = "0.1.0"
description = "Traceable customer and market knowledge extraction helpers"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
office = ["python-docx>=1.1", "openpyxl>=3.1", "pypdf>=5", "python-pptx>=1.0", "extract-msg>=0.52"]
test = ["pytest>=8"]

[project.scripts]
customer-market-extractor = "customer_market_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
